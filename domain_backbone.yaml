    standards_defined: true
    cross_manufacturer_stability: high
    tier: 3

  - name: Altitude limit
    structural_role: descriptive
    data_type: scalar
    unit: {base_unit: m, unit_system: SI}
    intrinsic: false
    standards_defined: true
    cross_manufacturer_stability: high
    tier: 3

  - name: Ambient temperature range
    structural_role: descriptive
    data_type: range
    unit: {base_unit: °C, unit_system: SI}
    intrinsic: true
    standards_defined: true
    cross_manufacturer_stability: medium
    tier: 3

  - name: Wire size range
    structural_role: descriptive
    data_type: range
    unit: {base_unit: mm², unit_system: SI}
