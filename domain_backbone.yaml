    standards_defined: true
    cross_manufacturer_stability: high
    tier: 3

  - name: Product description
    structural_role: descriptive
    data_type: scalar
    unit: null
    intrinsic: false
    standards_defined: false
    cross_manufacturer_stability: low
    tier: 3

# ---------------------------------------------------------------------------
# Invariants
# ---------------------------------------------------------------------------
invariants:
  - id: INV-01
    rule: "Ui >= Ue"
    description: Rated insulation voltage is always >= rated operational voltage.

  - id: INV-02
    rule: "Ie(AC-1) >= Ie(AC-3) >= Ie(AC-4)"
    description: Current rating decreases with increasing switching severity.

  - id: INV-03
    rule: "MechanicalDurability >> ElectricalDurability"
    description: Mechanical lifecycle is at least 10x the electrical lifecycle.

  - id: INV-04
    rule: "NumberOfPoles >= MainNOContacts"
    description: Number of poles constrains maximum main NO contact count.

  - id: INV-05
    rule: "HP = f(Voltage, Phase, NEMA_Size)"
    description: Horsepower is never standalone; always conditional on voltage and phase.

  - id: INV-06
    rule: "ContactConfig = f(NO_count, NC_count)"
    description: Contact configuration is a composite derived from NO and NC counts.

  - id: INV-07
    rule: "CoilVoltage independent of OperationalVoltage"
    description: Control circuit voltage is independent of power circuit voltage.

  - id: INV-08
    rule: "Every installation requires coordinated SCPD"
    description: A contactor cannot be installed without upstream short-circuit protection.

# ---------------------------------------------------------------------------
# Normalization patterns
# ---------------------------------------------------------------------------
normalization:
  multi_value_separator: " || "
  contact_config:
    pattern: '(\d+)\s*(NO|NC)'
    canonical: "{n}NO+{m}NC"
    examples:
      - input: "2 NO||2 NC"
        output: "2NO+2NC"
      - input: "1NC+1NO"
        output: "1NO+1NC"
  poles:
    pattern: '(\d+)\s*(P|Pole|Poles)?'
    canonical: "{n}"
    examples:
      - input: "3P"
        output: "3"
      - input: "3 Pole"
        output: "3"
      - input: "Three Pole"
        output: "3"
  mounting:
    canonical_values:
      - DIN Rail
      - Panel Mount
      - DIN Rail/Panel Mount
      - Screw Mount
    mappings:
      "On Rail": "DIN Rail"
      "35mm rail": "DIN Rail"
      "Clip-On": "DIN Rail"
      "Snap-On": "DIN Rail"
      "Base Mount": "Panel Mount"
  voltage:
    unit_normalization:
      - {pattern: '(\d+)\s*VAC', canonical: "{n} V AC"}
      - {pattern: '(\d+)\s*VDC', canonical: "{n} V DC"}
      - {pattern: '(\d+)\s*V\s*AC', canonical: "{n} V AC"}
  certifications:
    separator: " || "
    canonical_values:
      - UL Listed
      - CSA Certified
      - CE Approved
      - GOST Certified
      - RoHS Compliant

# ---------------------------------------------------------------------------
# Utilization category reference table
# ---------------------------------------------------------------------------
utilization_categories:
  AC-1:
    load_type: Non-inductive or slightly inductive loads
    typical_application: Resistive heating, distribution
    making_multiplier: 1.5
    breaking_multiplier: 1.5
  AC-2:
    load_type: Slip-ring motors
    typical_application: Crane motors, hoist motors
    making_multiplier: 4.0
    breaking_multiplier: 4.0
  AC-3:
    load_type: Squirrel-cage motors — starting, switching off during running
    typical_application: General motor control (most common)
    making_multiplier: 10.0
    breaking_multiplier: 8.0
  AC-4:
    load_type: Squirrel-cage motors — starting, plugging, inching
    typical_application: Reversing, jogging
    making_multiplier: 12.0
    breaking_multiplier: 10.0
