[project]
name = "normalisation-rules"
version = "0.1.0"
description = "Derive normalisation rules for Electrical Equipment (Contactors) using LangGraph, OpenAI, Groq, and Tavily."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
]

[project.scripts]
normalisation-rules = "normalisation_rules.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normalisation_rules"]

[tool.hatch.build.targets.sdist]
packages = ["src/normalisation_rules"]

[dependency-groups]
dev = []
